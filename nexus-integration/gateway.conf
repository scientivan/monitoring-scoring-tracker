# ============================================================
#  NEXUS API Gateway (nginx)
#  Satu pintu masuk -> rute ke tiap microservice via nama service.
#  Nama "svc-auth", dst. resolve otomatis di network nexus-net.
#  Catatan: container internal listen di port 8080.
# ============================================================

# Header proxy standar dipakai ulang di semua route.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        return 200 'gateway ok\n';
        add_header Content-Type text/plain;
    }

    # ---- AUTH / IDENTITY & SSO ----
    location /auth/    { proxy_pass http://svc-auth:8080/; }

    # ---- BIDDING ----
    location /bidding/ { proxy_pass http://svc-bidding:8080/; }

    # ---- MATCH / TEAM-MATCHING ----
    location /match/   { proxy_pass http://svc-match:8080/; }

    # ---- AUDIT / MONITORING-SCORING-TRACKER ----
    location /tracker/ { proxy_pass http://svc-audit:8080/; }

    # ---- NOTIFY / NOTIFICATION ----
    location /notify/  { proxy_pass http://svc-notify:8080/; }

    location / {
        return 200 'NEXUS Gateway up. Routes: /auth /bidding /match /tracker /notify\n';
        add_header Content-Type text/plain;
    }
}
