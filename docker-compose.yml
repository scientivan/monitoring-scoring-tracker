services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "3300:3300"
    restart: always
    environment:
      - NODE_ENV=production
      - DB_HOST=db # Gunakan nama service 'db', bukan 'localhost'
      - DB_PORT=5432 # Gunakan port internal container, bukan 5433
      - DB_USER=kel4
      - DB_PASSWORD=kel4
      - DB_NAME=kel4
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-}
    depends_on:
      - db
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-kel4}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kel4}
      POSTGRES_DB: ${DB_NAME:-kel4}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kel4 -d kel4" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
