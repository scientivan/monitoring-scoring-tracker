services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8084:8080"
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_HOST=db # Gunakan nama service 'db', bukan 'localhost'
      - DB_PORT=5432 # Gunakan port internal container, bukan 5433
      - DB_USER=kel4
      - DB_PASSWORD=kel4
      - DB_NAME=kel4
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE:-tracker.events}
      - RABBITMQ_EXCHANGE_TYPE=${RABBITMQ_EXCHANGE_TYPE:-topic}
      - RABBITMQ_ROUTING_PREFIX=${RABBITMQ_ROUTING_PREFIX:-tracker}
      - RABBITMQ_PUBLISH_RETRIES=${RABBITMQ_PUBLISH_RETRIES:-3}
      - RABBITMQ_PUBLISH_RETRY_DELAY_MS=${RABBITMQ_PUBLISH_RETRY_DELAY_MS:-200}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - PROJECT_COMPLETION_LOCK_TTL_MS=${PROJECT_COMPLETION_LOCK_TTL_MS:-10000}
    depends_on:
      - db
      - rabbitmq
      - redis
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-kel4}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kel4}
      POSTGRES_DB: ${DB_NAME:-kel4}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kel4 -d kel4" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
