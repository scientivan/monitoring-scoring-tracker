  /api/v1/milestones:
    post:
      summary: Create a new milestone
      tags:
        - Milestones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneCreateInput"
      responses:
        "201":
          description: Milestone created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

    get:
      summary: List milestones with optional filters
      tags:
        - Milestones
      parameters:
        - in: query
          name: employerId
          required: false
          schema:
            type: string
          description: Filter by employer ID
        - in: query
          name: studentId
          required: false
          schema:
            type: string
          description: Filter by student ID
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [open, in_progress, completed, cancelled]
          description: Filter by milestone status
      responses:
        "200":
          description: Milestones retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneListResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/milestones/{id}:
    get:
      summary: Get milestone by ID
      tags:
        - Milestones
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Milestone ID
      responses:
        "200":
          description: Milestone retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "404":
          description: Milestone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

    patch:
      summary: Update milestone
      tags:
        - Milestones
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Milestone ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdateInput"
      responses:
        "200":
          description: Milestone updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "404":
          description: Milestone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "409":
          description: Conflict error (e.g., milestone already completed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/submissions:
    post:
      summary: Create a new milestone submission
      tags:
        - Submissions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SubmissionCreateInput"
      responses:
        "201":
          description: Submission created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "409":
          description: Conflict error (e.g., submission already exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

    get:
      summary: List submissions with optional filters
      tags:
        - Submissions
      parameters:
        - in: query
          name: milestoneId
          required: false
          schema:
            type: string
          description: Filter by milestone ID
        - in: query
          name: studentId
          required: false
          schema:
            type: string
          description: Filter by student ID
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [submitted, approved, rejected, needs_revision]
          description: Filter by submission status
      responses:
        "200":
          description: Submissions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionListResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/submissions/{id}:
    get:
      summary: Get submission detail
      tags:
        - Submissions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Submission ID
      responses:
        "200":
          description: Submission retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetailResponse"
        "404":
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/submissions/{id}/download:
    get:
      summary: Get submission file download link
      tags:
        - Submissions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Submission ID
      responses:
        "200":
          description: Submission download link retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDownloadResponse"
        "404":
          description: Submission or file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/submissions/{id}/review:
    post:
      summary: Create submission review
      tags:
        - Submissions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Submission ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionReviewCreateInput"
      responses:
        "201":
          description: Submission review created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionReviewResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "403":
          description: Forbidden - only client can review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "404":
          description: Submission or reviewer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "409":
          description: Conflict - submission already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/nft/team/{teamId}:
    get:
      summary: List NFT records by team
      tags:
        - NFT
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: NFT records retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NftListResponse"

  /api/v1/nft/{id}/verify:
    get:
      summary: Verify NFT placeholder
      tags:
        - NFT
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: NFT verification completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NftVerifyResponse"

components:
  schemas:
    StandardErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Field 'teamId' is required
            timestamp:
              type: string
              format: date-time

    Document:
      type: object
      properties:
        id:
          type: string
        teamId:
          type: string
        uploaderId:
          type: string
        fileUrl:
          type: string
        fileName:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
        fileHash:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    DocumentCreateInput:
      type: object
      required:
        - teamId
        - uploaderId
        - fileUrl
        - fileName
        - fileType
        - fileSize
        - fileHash
      properties:
        teamId:
          type: string
        uploaderId:
          type: string
        fileUrl:
          type: string
        fileName:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
        fileHash:
          type: string
        description:
          type: string

    DocumentResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Document"
        message:
          type: string

    DocumentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        message:
          type: string

    DocumentDownloadResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            fileName:
              type: string
            fileUrl:
              type: string
            downloadStatus:
              type: string
        message:
          type: string

    LogbookEntry:
      type: object
      properties:
        id:
          type: string
        teamId:
          type: string
        authorId:
          type: string
        sprintNumber:
          type: integer
          nullable: true
        status:
          type: string
        description:
          type: string
        blockers:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    LogbookCreateInput:
      type: object
      required:
        - teamId
        - authorId
        - status
        - description
      properties:
        teamId:
          type: string
        authorId:
          type: string
        sprintNumber:
          type: integer
        status:
          type: string
          enum: [in_progress, blocked, completed]
        description:
          type: string
        blockers:
          type: string

    LogbookResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/LogbookEntry"
        message:
          type: string

    LogbookListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LogbookEntry"
        message:
          type: string

    Assessment:
      type: object
      properties:
        id:
          type: string
        teamId:
          type: string
        graderId:
          type: string
        scoreArchitecture:
          type: number
          nullable: true
        scoreImplementation:
          type: number
          nullable: true
        scoreDocumentation:
          type: number
          nullable: true
        scorePresentation:
          type: number
          nullable: true
        finalScore:
          type: number
        notes:
          type: string
          nullable: true
        walletAddress:
          type: string
          nullable: true
        isLocked:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AssessmentCreateInput:
      type: object
      required:
        - teamId
        - graderId
        - finalScore
      properties:
        teamId:
          type: string
        graderId:
          type: string
        scoreArchitecture:
          type: number
        scoreImplementation:
          type: number
        scoreDocumentation:
          type: number
        scorePresentation:
          type: number
        finalScore:
          type: number
        notes:
          type: string
        walletAddress:
          type: string

    AssessmentResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Assessment"
        message:
          type: string

    AssessmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"
        message:
          type: string

    AssessmentLockResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            assessment:
              $ref: "#/components/schemas/Assessment"
            event:
              type: object
            nft:
              $ref: "#/components/schemas/NftRecord"
        message:
          type: string

    Milestone:
      type: object
      properties:
        id:
          type: string
          description: Unique milestone identifier
        title:
          type: string
          description: Milestone title
        paymentAmount:
          type: number
          format: decimal
          description: Payment amount for milestone completion
        description:
          type: string
          nullable: true
          description: Optional milestone description
        deadline:
          type: string
          format: date-time
          description: Deadline for milestone completion (ISO 8601 format)
        employerId:
          type: string
          description: ID of the employer
        studentId:
          type: string
          description: ID of the student
        status:
          type: string
          enum: [open, in_progress, completed, cancelled]
          description: Current status of the milestone
        createdAt:
          type: string
          format: date-time
          description: Timestamp when milestone was created

    MilestoneCreateInput:
      type: object
      required:
        - title
        - employerId
        - studentId
        - paymentAmount
        - deadline
      properties:
        title:
          type: string
          description: Milestone title (required)
          example: "Complete API Documentation"
        paymentAmount:
          type: number
          format: decimal
          description: Payment amount in positive number (required)
          example: 1000
        description:
          type: string
          nullable: true
          description: Optional milestone description
          example: "Document all REST API endpoints"
        deadline:
          type: string
          format: date-time
          description: Future deadline in ISO 8601 format (required)
          example: "2026-12-31T23:59:59.000Z"
        employerId:
          type: string
          description: Employer ID (required)
          example: "emp-12345"
        studentId:
          type: string
          description: Student ID (required)
          example: "std-67890"

    MilestoneUpdateInput:
      type: object
      properties:
        title:
          type: string
          description: Milestone title
          example: "Update API Documentation"
        paymentAmount:
          type: number
          format: decimal
          description: Payment amount (must be positive)
          example: 1200
        description:
          type: string
          nullable: true
          description: Milestone description
          example: "Document all endpoints and update schemas"
        deadline:
          type: string
          format: date-time
          description: Future deadline in ISO 8601 format
          example: "2027-01-15T23:59:59.000Z"
        status:
          type: string
          enum: [open, in_progress, completed, cancelled]
          description: Milestone status
          example: "in_progress"

    MilestoneResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Milestone"
        message:
          type: string
          example: "Milestone retrieved successfully"

    MilestoneListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        message:
          type: string
          example: "Milestones retrieved successfully"

    SubmissionLink:
      type: object
      properties:
        url:
          type: string
          description: Link URL
          example: "https://github.com/user/repo"
        label:
          type: string
          nullable: true
          description: Optional label for the link
          example: "GitHub Repository"

    Submission:
      type: object
      properties:
        id:
          type: string
          description: Unique submission identifier
        milestoneId:
          type: string
          description: Associated milestone ID
        studentId:
          type: string
          description: Student who made the submission
        description:
          type: string
          description: Submission description
        fileUrl:
          type: string
          nullable: true
          description: URL of uploaded proof file
        fileName:
          type: string
          nullable: true
          description: Name of uploaded file
        fileType:
          type: string
          nullable: true
          description: MIME type of uploaded file
        fileSize:
          type: integer
          nullable: true
          description: Size of uploaded file in bytes
        fileHash:
          type: string
          nullable: true
          description: SHA256 hash of the file
        links:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionLink"
          description: Array of submission links
        status:
          type: string
          enum: [submitted, approved, rejected, needs_revision]
          description: Current submission status
        submittedAt:
          type: string
          format: date-time
          description: Timestamp when submission was made
        approvedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when submission was approved
        approvedBy:
          type: string
          nullable: true
          description: ID of user who approved the submission
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    SubmissionCreateInput:
      type: object
      required:
        - milestoneId
        - studentId
        - description
      properties:
        milestoneId:
          type: string
          description: Milestone ID (required)
          example: "milestone-12345"
        studentId:
          type: string
          description: Student ID (required)
          example: "std-67890"
        description:
          type: string
          description: Submission description (required)
          example: "This is my milestone submission with proof of completion"
        file:
          type: string
          format: binary
          description: Optional proof file (multipart form-data)
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              label:
                type: string
                nullable: true
          description: Optional array of submission links (can be JSON array or array of objects)
          example:
            - url: "https://github.com/user/repo"
              label: "GitHub Repository"
            - url: "https://docs.example.com"
              label: "Documentation"

    SubmissionReviewLink:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        label:
          type: string
          nullable: true

    SubmissionReview:
      type: object
      properties:
        id:
          type: string
          description: Review ID
        submissionId:
          type: string
          description: Associated submission ID
        reviewerId:
          type: string
          description: ID of the reviewer
        status:
          type: string
          enum: [approved, rejected, needs_revision]
          description: Review decision status
        notes:
          type: string
          nullable: true
          description: Optional review notes
        createdAt:
          type: string
          format: date-time
          description: When review was created

    SubmissionWithLatestReview:
      type: object
      properties:
        id:
          type: string
        milestoneId:
          type: string
        studentId:
          type: string
        description:
          type: string
        fileUrl:
          type: string
          nullable: true
        fileName:
          type: string
          nullable: true
        fileType:
          type: string
          nullable: true
        fileSize:
          type: integer
          nullable: true
        fileHash:
          type: string
          nullable: true
        links:
