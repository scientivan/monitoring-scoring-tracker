openapi: 3.0.0
info:
  title: API Project Monitoring & Scoring (Tracker)
  description: REST API documentation for the monitoring and scoring tracker.
  version: 1.0.0
  contact:
    name: Tim Developer
    email: dev@example.com

servers:
  - url: "http://localhost:3000/"
    description: Development server

tags:
  - name: System
    description: System endpoints
  - name: Documents
    description: Document-related operations
  - name: Logbook
    description: Logbook-related operations
  - name: Assessments
    description: Assessment-related operations
  - name: Milestones
    description: Milestone-related operations
  - name: Submissions
    description: Milestone submission-related operations
  - name: NFT
    description: NFT-related operations

paths:
  /api/v1/health:
    get:
      summary: Check server health
      tags:
        - System
      responses:
        "200":
          description: Server is healthy

  /api/v1/documents:
    post:
      summary: Upload a new document
      tags:
        - Documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentCreateInput"
      responses:
        "201":
          description: Document created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/documents/team/{teamId}:
    get:
      summary: List documents by team
      tags:
        - Documents
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Documents retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"

  /api/v1/documents/{id}:
    get:
      summary: Get document detail
      tags:
        - Documents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/documents/{id}/download:
    get:
      summary: Download document placeholder
      tags:
        - Documents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document download link retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDownloadResponse"

