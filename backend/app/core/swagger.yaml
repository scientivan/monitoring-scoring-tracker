openapi: 3.0.0
info:
  title: API Project Monitoring & Scoring (Tracker)
  description: REST API documentation for the monitoring and scoring tracker.
  version: 1.0.0
  contact:
    name: Tim Developer
    email: dev@example.com

servers:
  - url: "http://localhost:3300/"
    description: Backend development server
  - url: "http://localhost/"
    description: Nginx gateway for local development

tags:
  - name: System
    description: System endpoints
  - name: Documents
    description: Document-related operations
  - name: Milestones
    description: Milestone-related operations
  - name: Submissions
    description: Milestone submission proof operations
  - name: Logbook
    description: Logbook-related operations
  - name: Assessments
    description: Assessment-related operations
  - name: NFT
    description: NFT-related operations

paths:
  /api/v1/health:
    get:
      summary: Check server health
      tags:
        - System
      responses:
        "200":
          description: Server is healthy

  /api/v1/documents:
    post:
      summary: Upload a new document
      tags:
        - Documents
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentCreateInput"
      responses:
        "201":
          description: Document created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/documents/team/{teamId}:
    get:
      summary: List documents by team
      tags:
        - Documents
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Documents retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"

  /api/v1/documents/{id}:
    get:
      summary: Get document detail
      tags:
        - Documents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetailResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/documents/{id}/download:
    get:
      summary: Get document download link
      tags:
        - Documents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document download link retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDownloadResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/documents/{id}/review:
    post:
      summary: Create a new document review entry
      tags:
        - Documents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentReviewCreateInput"
      responses:
        "201":
          description: Document review created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentReviewCreateResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/milestones:
    post:
      summary: Create a new milestone
      tags:
        - Milestones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneCreateInput"
      responses:
        "201":
          description: Milestone created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
    get:
      summary: List milestones
      tags:
        - Milestones
      parameters:
        - in: query
          name: employerId
          required: false
          schema:
            type: string
        - in: query
          name: studentId
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [open, in_progress, completed, cancelled]
      responses:
        "200":
          description: Milestones retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneListResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/milestones/{id}:
    get:
      summary: Get milestone detail
      tags:
        - Milestones
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Milestone retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "404":
          description: Milestone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
    patch:
      summary: Update an existing milestone
      tags:
        - Milestones
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdateInput"
      responses:
        "200":
          description: Milestone updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "404":
          description: Milestone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "409":
          description: Milestone cannot be edited in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/submissions:
    post:
      summary: Create a new milestone submission proof
      tags:
        - Submissions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SubmissionCreateInput"
      responses:
        "201":
          description: Submission created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "404":
          description: Milestone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
    get:
      summary: List milestone submissions
      tags:
        - Submissions
      parameters:
        - in: query
          name: milestoneId
          required: false
          schema:
            type: string
        - in: query
          name: studentId
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [submitted, approved, rejected, needs_revision]
      responses:
        "200":
          description: Submissions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionListResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/submissions/{id}:
    get:
      summary: Get submission detail
      tags:
        - Submissions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submission retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "404":
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/submissions/{id}/status:
    patch:
      summary: Update submission review status
      tags:
        - Submissions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionStatusUpdateInput"
      responses:
        "200":
          description: Submission status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
        "404":
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/submissions/{id}/download:
    get:
      summary: Get submission proof download link
      tags:
        - Submissions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submission download link retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDownloadResponse"
        "404":
          description: Submission or uploaded file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/logbook:
    post:
      summary: Create logbook entry
      tags:
        - Logbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogbookCreateInput"
      responses:
        "201":
          description: Logbook created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogbookResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"

  /api/v1/logbook/team/{teamId}:
    get:
      summary: List logbook entries by team
      tags:
        - Logbook
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Logbooks retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogbookListResponse"

  /api/v1/logbook/team/{teamId}/latest:
    get:
      summary: Get latest logbook entry by team
      tags:
        - Logbook
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest logbook retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogbookResponse"

  /api/v1/assessments:
    post:
      summary: Create assessment draft
      tags:
        - Assessments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentCreateInput"
      responses:
        "201":
          description: Assessment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResponse"

  /api/v1/assessments/{id}/lock:
    post:
      summary: Lock assessment and trigger NFT placeholder
      tags:
        - Assessments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Assessment locked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentLockResponse"

  /api/v1/assessments/team/{teamId}:
    get:
      summary: List assessments by team
      tags:
        - Assessments
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Assessments retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentListResponse"

  /api/v1/nft/team/{teamId}:
    get:
      summary: List NFT records by team
      tags:
        - NFT
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: NFT records retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NftListResponse"

  /api/v1/nft/{id}/verify:
    get:
      summary: Verify NFT placeholder
      tags:
        - NFT
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: NFT verification completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NftVerifyResponse"

components:
  schemas:
    StandardErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Field 'teamId' is required
            timestamp:
              type: string
              format: date-time

    Document:
      type: object
      properties:
        id:
          type: string
        teamId:
          type: string
        uploaderId:
          type: string
        fileUrl:
          type: string
        fileName:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
        fileHash:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    DocumentReview:
      type: object
      properties:
        id:
          type: string
        documentId:
          type: string
        reviewerId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, needs_revision]
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    DocumentCreateInput:
      type: object
      required:
        - teamId
        - uploaderId
        - file
      properties:
        teamId:
          type: string
        uploaderId:
          type: string
        description:
          type: string
        file:
          type: string
          format: binary
          description: PDF file upload

    DocumentResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Document"
        message:
          type: string

    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/Document"
        - type: object
          properties:
            latestReview:
              oneOf:
                - $ref: "#/components/schemas/DocumentReview"
                - type: "null"

    DocumentDetailResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/DocumentDetail"
        message:
          type: string

    DocumentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        message:
          type: string

    DocumentDownloadResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            fileName:
              type: string
            fileUrl:
              type: string
            downloadStatus:
              type: string
              example: ready
        message:
          type: string

    DocumentReviewCreateInput:
      type: object
      required:
        - reviewerId
        - status
      properties:
        reviewerId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, needs_revision]
        notes:
          type: string

    DocumentReviewCreatePayload:
      type: object
      properties:
        documentId:
          type: string
        review:
          $ref: "#/components/schemas/DocumentReview"

    DocumentReviewCreateResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/DocumentReviewCreatePayload"
        message:
          type: string

    Milestone:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        paymentAmount:
          type: number
        description:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
        employerId:
          type: string
        studentId:
          type: string
        status:
          type: string
          enum: [open, in_progress, completed, cancelled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MilestoneCreateInput:
      type: object
      required:
        - title
        - paymentAmount
        - deadline
        - employerId
        - studentId
      properties:
        title:
          type: string
        paymentAmount:
          type: number
        description:
          type: string
        deadline:
          type: string
          format: date-time
        employerId:
          type: string
        studentId:
          type: string

    MilestoneUpdateInput:
      type: object
      properties:
        title:
          type: string
        paymentAmount:
          type: number
        description:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
        status:
          type: string
          enum: [open, in_progress, completed, cancelled]

    MilestoneResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Milestone"
        message:
          type: string

    MilestoneListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        message:
          type: string

    SubmissionLink:
      type: object
      properties:
        url:
          type: string
        label:
          type: string
          nullable: true

    Submission:
      type: object
      properties:
        id:
          type: string
        milestoneId:
          type: string
        studentId:
          type: string
        description:
          type: string
        fileUrl:
          type: string
          nullable: true
        fileName:
          type: string
          nullable: true
        fileType:
          type: string
          nullable: true
        fileSize:
          type: integer
          nullable: true
        fileHash:
          type: string
          nullable: true
        links:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionLink"
        status:
          type: string
          enum: [submitted, approved, rejected, needs_revision]
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SubmissionCreateInput:
      type: object
      required:
        - milestoneId
        - studentId
        - description
      properties:
        milestoneId:
          type: string
        studentId:
          type: string
        description:
          type: string
        links:
          type: string
          description: JSON array of URLs or objects with url and label
          example: '[{"url":"https://example.com/proof","label":"Demo"}]'
        file:
          type: string
          format: binary
          description: Optional PDF, JPG, PNG, or WEBP proof file. A submission must include at least one file or one link.

    SubmissionStatusUpdateInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [approved, rejected, needs_revision]

    SubmissionResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Submission"
        message:
          type: string

    SubmissionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
        message:
          type: string

    SubmissionDownloadResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            fileName:
              type: string
            fileUrl:
              type: string
            downloadStatus:
              type: string
              example: ready
        message:
          type: string

    LogbookEntry:
      type: object
      properties:
        id:
          type: string
        teamId:
          type: string
        authorId:
          type: string
        sprintNumber:
          type: integer
          nullable: true
        status:
          type: string
        description:
          type: string
        blockers:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    LogbookCreateInput:
      type: object
      required:
        - teamId
        - authorId
        - status
        - description
      properties:
        teamId:
          type: string
        authorId:
          type: string
        sprintNumber:
          type: integer
        status:
          type: string
          enum: [in_progress, blocked, completed]
        description:
          type: string
        blockers:
          type: string

    LogbookResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/LogbookEntry"
        message:
          type: string

    LogbookListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LogbookEntry"
        message:
          type: string

    Assessment:
      type: object
      properties:
        id:
          type: string
        teamId:
          type: string
        graderId:
          type: string
        scoreArchitecture:
          type: number
          nullable: true
        scoreImplementation:
          type: number
          nullable: true
        scoreDocumentation:
          type: number
          nullable: true
        scorePresentation:
          type: number
          nullable: true
        finalScore:
          type: number
        notes:
          type: string
          nullable: true
        walletAddress:
          type: string
          nullable: true
        isLocked:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AssessmentCreateInput:
      type: object
      required:
        - teamId
        - graderId
        - finalScore
      properties:
        teamId:
          type: string
        graderId:
          type: string
        scoreArchitecture:
          type: number
        scoreImplementation:
          type: number
        scoreDocumentation:
          type: number
        scorePresentation:
          type: number
        finalScore:
          type: number
        notes:
          type: string
        walletAddress:
          type: string

    AssessmentResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Assessment"
        message:
          type: string

    AssessmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"
        message:
          type: string

    AssessmentLockResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            assessment:
              $ref: "#/components/schemas/Assessment"
            event:
              type: object
            nft:
              $ref: "#/components/schemas/NftRecord"
        message:
          type: string

    NftRecord:
      type: object
      properties:
        id:
          type: string
        assessmentId:
          type: string
        teamId:
          type: string
        walletAddress:
          type: string
        contractAddress:
          type: string
        tokenId:
          type: string
        txHash:
          type: string
        network:
          type: string
        metadataUri:
          type: string
        mintedAt:
          type: string
          format: date-time
        verifyStatus:
          type: string

    NftListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NftRecord"
        message:
          type: string

    NftVerifyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            assessmentId:
              type: string
            teamId:
              type: string
            network:
              type: string
            txHash:
              type: string
            verified:
              type: boolean
            status:
              type: string
        message:
          type: string
